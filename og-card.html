<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0a;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Profile image on right */
    .bg-image {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 60%;
      background: url('img/tyler-headshot.jpg') center center / cover no-repeat;
      opacity: 0.8;
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.8) 0%, transparent 100%);
      mask-image: linear-gradient(to left, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    /* Red glow */
    .glow {
      position: absolute;
      top: -40%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(230,47,55,0.3) 0%, transparent 70%);
      opacity: 0.4;
      pointer-events: none;
    }

    .content {
      position: relative;
      padding: 60px 70px;
      max-width: 750px;
    }

    .name {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 70px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #E62F37, #ff6b35, #E62F37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #ff5c5c;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .gradient-text {
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 2px #E62F37;
    }

    .subtitle {
      font-size: 18px;
      color: #a0a0a0;
      line-height: 1.6;
      max-width: 520px;
    }

    .url {
      position: absolute;
      bottom: 40px;
      left: 70px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #666;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="name">Tyler Richards</div>
    <div class="eyebrow">Operator &rarr; Investor &rarr; Educator</div>
    <h1>I help founders build<br>companies that<br><span class="gradient-text">actually work.</span></h1>
    <p class="subtitle">3x exited founder. GP at Startup Ignition Ventures. BYU professor. I don't just invest in startups, I get in the trenches with the founders who build them.</p>
  </div>
  <div class="url">trich.me</div>
</body>
</html>
