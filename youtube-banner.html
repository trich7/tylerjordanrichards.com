<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #fff;
      padding: 40px;
    }

    .label { font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }

    /* Full banner 2560x1440 */
    .banner {
      width: 2560px;
      height: 1440px;
      background: #0a0a0a;
      position: relative;
      overflow: hidden;
      transform: scale(0.35);
      transform-origin: top center;
      margin-bottom: -800px;
      outline: 2px solid red;
    }

    /* Safe zone indicator */
    .safe-zone {
      position: absolute;
      top: 508px;
      left: 507px;
      width: 1546px;
      height: 423px;
      border: 2px dashed rgba(255,255,255,0.15);
      z-index: 10;
      pointer-events: none;
    }
    .safe-label {
      position: absolute;
      top: -20px;
      left: 0;
      font-size: 14px;
      color: rgba(255,255,255,0.25);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Background image */
    .banner::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 60%;
      background: url('img/tyler-headshot.jpg') center center / cover no-repeat;
      opacity: 0.35;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,1) 100%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,1) 100%);
    }

    /* Red glow */
    .banner::after {
      content: '';
      position: absolute;
      top: -20%;
      right: 10%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(230, 47, 55, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Content - centered in safe zone */
    .banner-content {
      position: absolute;
      top: 508px;
      left: 507px;
      width: 1546px;
      height: 423px;
      display: flex;
      align-items: center;
      padding: 0 80px;
      z-index: 5;
    }

    .banner-text {
      max-width: 900px;
    }

    .banner-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #ff5c5c;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .banner-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 20px;
    }

    .banner-name .gradient-text {
      background: linear-gradient(135deg, #E62F37, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .banner-tagline {
      font-size: 28px;
      color: #a0a0a0;
      line-height: 1.5;
      max-width: 700px;
    }

    .banner-tagline strong {
      color: #f5f5f5;
    }

    /* Bottom right follow CTA */
    .banner-bottom-right {
      position: absolute;
      bottom: 540px;
      right: 560px;
      z-index: 5;
      text-align: right;
    }

    .banner-follow-text {
      font-size: 18px;
      color: #666;
      display: block;
      margin-bottom: 10px;
    }

    .banner-follow-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: flex-end;
    }

    .banner-si-logo {
      height: 32px;
      width: auto;
      opacity: 0.8;
    }

    .banner-handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #a0a0a0;
      font-weight: 500;
    }

    /* Subtle dot pattern overlay */
    .dot-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="label">YouTube Banner: 2560 x 1440 (red = full size, dashed = safe zone)</div>

  <div class="banner">
    <div class="dot-overlay"></div>

    <div class="safe-zone">
      <div class="safe-label">safe zone (1546 x 423)</div>
    </div>

    <div class="banner-content">
      <div class="banner-text">
        <div class="banner-eyebrow">Operator &rarr; Investor &rarr; Educator</div>
        <div class="banner-name">Tyler <span class="gradient-text">Richards</span></div>
        <div class="banner-tagline">3x exited founder. GP at <strong>Startup Ignition Ventures</strong>. BYU professor. I help founders build companies that actually work.</div>
      </div>
    </div>

    <div class="banner-bottom-right">
      <span class="banner-follow-text">More content on</span>
      <div class="banner-follow-brand">
        <img src="img/logo-startupignition.svg" alt="Startup Ignition" class="banner-si-logo">
        <span class="banner-handle">@startupignition</span>
      </div>
    </div>
  </div>

</body>
</html>
